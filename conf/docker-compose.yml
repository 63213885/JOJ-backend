version: '3.8'
services:
  # -------------------------------
  # MySQL
  # -------------------------------
  mysql:
    image: mysql:8 # 使用的镜像
    container_name: joj-mysql # 启动的实例名称
    environment:
      MYSQL_ROOT_PASSWORD: 666666 # root 用户密码
      TZ: Asia/Shanghai
    ports:
      - "3306:3306" # 端口映射
    volumes:
      - ./.mysql-data:/var/lib/mysql # 将数据目录挂载到本地目录以进行持久化
      - ./mysql-init:/docker-entrypoint-initdb.d # 启动脚本
#    command:
#      - --server-id=1
#      - --log-bin=mysql-bin
#      - --binlog-format=ROW
#      - --binlog-row-image=FULL
    restart: always # 崩溃后自动重启

  # -------------------------------
  # Redis
  # -------------------------------
  redis:
    image: redis:6
    container_name: joj-redis
    command: redis-server --requirepass "666666"
    ports:
      - "6379:6379"
    volumes:
      - ./.redis-data:/data # 持久化
    restart: always

