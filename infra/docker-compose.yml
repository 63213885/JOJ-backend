# docker compose -p joj up -d
# docker compose -p joj down
# -------------------------------

services:
  # -------------------------------
  # Nginx
  # -------------------------------
  nginx:
    image: nginx:1.25
    container_name: joj-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/joj.conf:/etc/nginx/conf.d/default.conf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - JojNetwork
    restart: unless-stopped

  # -------------------------------
  # MySQL
  # -------------------------------
  mysql:
    image: mysql:8 # 使用的镜像
    container_name: joj-mysql # 启动的实例名称
    environment:
      MYSQL_ROOT_PASSWORD: 666666 # root 用户密码
      TZ: Asia/Shanghai
    ports:
      - "3306:3306" # 端口映射
    volumes:
      - ./.mysql-data:/var/lib/mysql # 将数据目录挂载到本地目录以进行持久化
      - ./mysql-init:/docker-entrypoint-initdb.d # 启动脚本
#    command:
#      - --server-id=1
#      - --log-bin=mysql-bin
#      - --binlog-format=ROW
#      - --binlog-row-image=FULL
    networks:
      - JojNetwork
    restart: unless-stopped # 崩溃后自动重启

  # -------------------------------
  # Redis
  # -------------------------------
  redis:
    image: redis:6
    container_name: joj-redis
    command: redis-server --requirepass "666666" --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - ./.redis-data:/data # 持久化
    networks:
      - JojNetwork
    restart: unless-stopped

#  # -------------------------------
#  # go-judge
#  # -------------------------------
#  go-judge:
#    image: criyle/go-judge:v1.12.0
#    container_name: joj-codeSandbox
#    privileged: true
#    shm_size: "256m"
#    ports:
#      - "5050:5050"
#    restart: always

  # -------------------------------
  # RabbitMQ
  # -------------------------------
  rabbitmq:
    image: rabbitmq:3.12.6-management # 支持管理面板的消息队列
    container_name: joj-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672" # RabbitMQ Dashboard 端口
    volumes:
      - ./.rabbitmq-data:/var/lib/rabbitmq # 持久化
    networks:
      - JojNetwork
    restart: unless-stopped

  # -------------------------------
  # Nacos
  # -------------------------------
  nacos:
    image: nacos/nacos-server:v2.2.0-slim
    container_name: joj-nacos
    ports:
      - "8848:8848"
      - "9848:9848" # gRPC 客户端请求端口 (用于服务注册与发现)
      # Nacos 2.2.0 之后的版本，9849 已被弃用，但为保险起见可以加上
      - "9849:9849" # gRPC 客户端请求端口（旧版）
    volumes:
      - ./.nacos-data:/home/nacos/data
      - ./.nacos-logs:/home/nacos/logs
    networks:
      - JojNetwork
    environment:
      - MODE=standalone # 单节点模式启动
      - PREFER_HOST_MODE=hostname # 支持 hostname
      - TZ=Asia/Shanghai # 控制时区
    restart: unless-stopped

  # -------------------------------
  # MinIO
  # -------------------------------
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: joj-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      TZ: Asia/Shanghai

      # 未完成分片上传清理
      MINIO_API_STALE_UPLOADS_EXPIRY: 24h
      MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL: 6h
    ports:
      - "9000:9000"   # S3 API，后端访问
      - "9001:9001"   # 控制台，浏览器访问
    volumes:
      - ./.minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - JojNetwork
    restart: unless-stopped

  # -------------------------------
  # MinIO 初始化
  # -------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: joj-minio-init
    depends_on:
      - minio
    networks:
      - JojNetwork
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'waiting for minio...';
        sleep 2;
      done;
      
      mc mb --ignore-existing local/image;
      mc mb --ignore-existing local/video;
      mc mb --ignore-existing local/testcase;
      mc mb --ignore-existing local/document;
      
      mc anonymous set download local/image;
      
      mc anonymous set none local/video;
      mc anonymous set none local/testcase;
      mc anonymous set none local/document;
      
      echo 'minio buckets initialized';
      exit 0;
      "
    restart: "no"

  # -------------------------------
  # XXL-JOB 初始化 SQL 下载
  # -------------------------------
  xxl-job-init-sql:
    image: alpine:3.20
    container_name: joj-xxl-job-init-sql
    command: >
      sh -c "
      mkdir -p /init &&
      if [ ! -f /init/01_tables_xxl_job.sql ]; then
        wget -O /init/01_tables_xxl_job.sql https://raw.githubusercontent.com/xuxueli/xxl-job/2.5.0/doc/db/tables_xxl_job.sql;
      else
        echo 'tables_xxl_job.sql already exists, skip download';
      fi
      "
    volumes:
      - ./xxl-job-init:/init
    restart: "no"

  # -------------------------------
  # XXL-JOB 初始化数据库
  # -------------------------------
  xxl-job-init-db:
    image: mysql:8
    container_name: joj-xxl-job-init-db
    depends_on:
      xxl-job-init-sql:
        condition: service_completed_successfully
      mysql:
        condition: service_started
    networks:
      - JojNetwork
    volumes:
      - ./xxl-job-init:/init
    entrypoint: >
      /bin/sh -c "
      until mysql -hmysql -uroot -p666666 -e 'select 1'; do
        echo 'waiting for mysql...';
        sleep 2;
      done;

      EXISTS=$$(mysql -hmysql -uroot -p666666 -N -e \"show databases like 'xxl_job';\");

      if [ -z \"$$EXISTS\" ]; then
        mysql -hmysql -uroot -p666666 < /init/01_tables_xxl_job.sql;
        echo 'xxl-job db initialized';
      else
        echo 'xxl_job database already exists, skip init';
      fi;

      exit 0;
      "
    restart: "no"

  # -------------------------------
  # XXL-JOB Admin
  # -------------------------------
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.5.0
    container_name: joj-xxl-job-admin
    depends_on:
      xxl-job-init-db:
        condition: service_completed_successfully
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xms256m -Xmx512m"
      PARAMS: >
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=root
        --spring.datasource.password=666666
        --xxl.job.accessToken=joj_xxl_job_token
        --xxl.job.i18n=zh_CN
        --xxl.job.logretentiondays=30
    ports:
      - "8088:8080"
    volumes:
      - ./xxl-job-admin/logs:/data/applogs
    networks:
      - JojNetwork
    restart: unless-stopped



networks:
  JojNetwork:
    driver: bridge