server {
    listen 80;
    server_name joj.ac.cn;

    client_max_body_size 10m;

    # 前端开发服务
    location / {
        proxy_pass http://host.docker.internal:6310;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 后端接口
    # /api/user/login -> http://host.docker.internal:8081/api/user/login
    location /api/ {
        proxy_pass http://host.docker.internal:8081;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 图片资源
    # /static/image/avatar/a.png -> http://minio:9000/image/avatar/a.png
    location /static/image/ {
        proxy_pass http://minio:9000/image/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 视频资源
    # /static/video/xxx -> http://minio:9000/video/xxx
    location /static/video/ {
        proxy_pass http://minio:9000/video/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}