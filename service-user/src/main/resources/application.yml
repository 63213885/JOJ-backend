server:
  port: 8082
  servlet:
    context-path: /api

spring:
  profiles:
    active: dev
  application:
    name: service-user

  cloud:
    nacos:
      server-addr: ${joj.cloud.nacos.server-addr}
      discovery:
        ip: ${joj.cloud.nacos.discovery.ip}

  # 支持 swagger3
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  datasource:
    url: jdbc:mysql://${joj.datasource.host}:${joj.datasource.port}/${joj.datasource.database}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${joj.datasource.username}
    password: ${joj.datasource.password}
    driver-class-name: ${joj.datasource.driver-class-name}
    hikari:
      maximum-pool-size: 20             # 连接池最大连接数
      minimum-idle: 5                   # 最小空闲连接
      idle-timeout: 600000              # 10 分钟：空闲多久回收
      max-lifetime: 1700000             # 约 28 分钟
      keepalive-time: 300000            # 5 分钟发一次“保活”
      connection-timeout: 30000         # 30 秒拿不到连接就报错

  jackson:
    serialization:
      write-dates-as-timestamps: false # 日期时间不要序列化成时间戳数字，而是序列化成字符串
    mapper:
      accept-case-insensitive-enums: true # 前端传枚举值时，忽略大小写

  redis:
    host: ${joj.redis.host}
    port: ${joj.redis.port}
    password: ${joj.redis.password}
  # session 配置
  session:
    store-type: redis
    # 3 天过期
    timeout: 259200

  mail:
    host: ${joj.mail.host}
    port: ${joj.mail.port}
    username: ${joj.mail.username}
    password: ${joj.mail.password}
    properties:
      mail:
        smtp:
          auth: ${joj.mail.properties.mail.smtp.auth}
          ssl:
            enable: ${joj.mail.properties.mail.smtp.ssl.enable}

  rabbitmq:
    host: ${joj.rabbitmq.host}
    port: ${joj.rabbitmq.port}
    username: ${joj.rabbitmq.username}
    password: ${joj.rabbitmq.password}
    listener:
      simple:
        prefetch: ${joj.rabbitmq.listener.simple.prefetch}


mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: INFO
    '[com.joj]': DEBUG

counter:
  rebuild:
    enabled: false
    lock:
      ttl-ms: 5000
      watchdog-ms: 30000
    rate:
      permits: 3
      window-seconds: 10
    backoff:
      base-ms: 500
      max-ms: 30000

verification:
  code-length: 6
  ttl: PT5M
  max-attempts: 5
  send-interval: PT60S
  daily-limit: 10

# 接口文档配置
knife4j:
  enable: true
  openapi:
    title: "接口文档"
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.joj

aliyun:
  sms:
    access-key-id: ${joj.aliyun.sms.access-key-id}
    access-key-secret: ${joj.aliyun.sms.access-key-secret}
    endpoint: ${joj.aliyun.sms.endpoint}
    sign-name: ${joj.aliyun.sms.sign-name}
    template-code: ${joj.aliyun.sms.template-code}
oss:
  endpoint: ${joj.oss.endpoint}
  access-key-id: ${joj.oss.access-key-id}
  access-key-secret: ${joj.oss.access-key-secret}
  bucket: ${joj.oss.bucket}
  public-domain: ${OSS_PUBLIC_DOMAIN:}
  folder: ${joj.oss.folder}

# 代码沙箱配置
codesandbox:
  type: remote
